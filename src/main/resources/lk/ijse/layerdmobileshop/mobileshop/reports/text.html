<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>

  <style>
    @page {
      size: A4;
      margin: 0;
    }

    body {
      margin: 0;
      font-family: Arial;
      background: white;
    }

    .page {
      width: 210mm;
      height: 297mm;
      padding: 15mm;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #f4c430;
      padding-bottom: 10px;
    }

    .logo {
      width: 120px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .info {
      text-align: right;
      font-size: 12px;
    }

    table {
      width: 100%%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 12px;
    }

    th {
      background: #f4c430;
      color: black;
      padding: 8px;
      text-align: left;
    }

    td {
      padding: 8px;
      border-bottom: 1px solid #ddd;
    }

    .right {
      text-align: right;
    }

    .footer {
      position: absolute;
      bottom: 15mm;
      width: 180mm;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      color: #d4a017;
      text-align: right;
      border-top: 2px solid #000;
      padding-top: 10px;
    }

    .shop {
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="page">

  <!-- HEADER -->
  <div class="header">

    <div>
      <img  class="logo" src="%s"/>
    </div>

    <div class="info">
      <h1>INVOICE</h1>
      <p><b>Order ID:</b> %s</p>
      <p><b>Date:</b> %s</p>
      <p><b>Customer:</b> %s</p>
    </div>

  </div>

  <!-- TABLE -->
  <table>
    <thead>
    <tr>
      <th>Code</th>
      <th>Description</th>
      <th>Details</th>
      <th class="right">Qty</th>
      <th class="right">Unit Price</th>
      <th class="right">Total</th>
    </tr>
    </thead>

    <tbody>
    %s
    </tbody>
  </table>

  <!-- FOOTER -->
  <div class="footer">

    <div class="shop">
      <b>Shop:</b> Pasi Mobile<br/>
      Wariyapola, Sri Lanka<br/>
      Tel: 077 475 7669
    </div>

    <div class="total">
      TOTAL: %.2f
    </div>

  </div>

</div>

</body>
</html>
